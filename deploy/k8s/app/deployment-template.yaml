apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-yaml-assistant
  namespace: k8s-yaml-assistant-prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-yaml-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-yaml-assistant
    spec:
      serviceAccountName: k8s-yaml-assistant
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: __K8S_YAML_ASSISTANT_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: k8s-yaml-assistant
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deepseek-runtime
                  key: api-key
            - name: VOYAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voyage-runtime
                  key: api-key
            - name: GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: k8s-yaml-assistant-auth
                  key: github-client-id
            - name: GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: k8s-yaml-assistant-auth
                  key: github-client-secret
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: k8s-yaml-assistant-auth
                  key: session-secret
            - name: ADMIN_GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: k8s-yaml-assistant-auth
                  key: admin-github-id
            - name: CONTROL_SUBJECT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-yaml-assistant-auth
                  key: subject-hmac-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet:
              path: /api/health/ready
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
              scheme: HTTP
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: control
              mountPath: /app/data/control
            - name: observations
              mountPath: /app/data/observability
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: control
          persistentVolumeClaim:
            claimName: k8s-yaml-assistant-control
        - name: observations
          persistentVolumeClaim:
            claimName: k8s-yaml-assistant-observation
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
