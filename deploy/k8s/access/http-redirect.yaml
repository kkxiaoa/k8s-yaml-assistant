apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: k8s-yaml-assistant-http-redirect
  namespace: k8s-yaml-assistant-prod
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Path(`/k8s-yaml-assistant`) || PathPrefix(`/k8s-yaml-assistant/`)
      priority: 10
      middlewares:
        - name: k8s-yaml-assistant-https-redirect
      services:
        - name: k8s-yaml-assistant
          port: 80
