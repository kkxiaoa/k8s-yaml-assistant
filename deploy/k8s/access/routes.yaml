apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: k8s-yaml-assistant
  namespace: k8s-yaml-assistant-prod
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`yaml.kubesmith.cloud`)
      priority: 10
      middlewares:
        - name: k8s-yaml-assistant-rate-limit
        - name: k8s-yaml-assistant-inflight
      services:
        - name: k8s-yaml-assistant
          port: 80
  tls:
    secretName: k8s-yaml-assistant-tls
