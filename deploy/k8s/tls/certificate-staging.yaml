apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-yaml-assistant-ip-staging
  namespace: k8s-yaml-assistant-prod
spec:
  secretName: k8s-yaml-assistant-ip-staging-tls
  issuerRef:
    name: letsencrypt-ip-staging
    kind: Issuer
    group: cert-manager.io
  ipAddresses:
    - 120.46.57.214
  renewBeforePercentage: 33
  usages:
    - digital signature
    - server auth
