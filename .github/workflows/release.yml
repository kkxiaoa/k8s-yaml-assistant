name: Release lifecycle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-lifecycle
  cancel-in-progress: false

jobs:
  release_please:
    name: Prepare or create release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      source_sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Open, update, or release the reviewed version
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    name: Build evidence for the new draft release
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      source_sha: ${{ needs.release_please.outputs.source_sha }}
      tag: ${{ needs.release_please.outputs.tag }}
      version: ${{ needs.release_please.outputs.version }}
