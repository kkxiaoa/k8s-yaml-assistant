name: PR verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release_state:
    name: Release preparation state
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # This isolated job does not execute pull request code.
      contents: write
    steps:
      - name: Reject an overlapping application draft
        if: github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.head_ref, 'release-please--branches--main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-state
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-state/releases.json
          if [[ "$(jq length release-state/releases.json)" -ge 100 ]]; then
            echo "release inventory exceeds the bounded inspection page" >&2
            exit 1
          fi
          ACTIVE_DRAFTS="$(
            jq '[
              .[]
              | select(
                  .draft == true
                  and (.tag_name | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
                )
            ] | length' release-state/releases.json
          )"
          if [[ "$ACTIVE_DRAFTS" -ne 0 ]]; then
            echo "active application draft blocks a new release PR" >&2
            exit 1
          fi

  verify:
    name: PR verify
    needs: release_state
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require release state gate
        env:
          RELEASE_STATE_RESULT: ${{ needs.release_state.result }}
        run: |
          if [[ "$RELEASE_STATE_RESULT" != "success" ]]; then
            echo "release state gate must succeed before PR verification" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check schema closure
        run: npm run schemas:check

      - name: Check reviewed aliases
        run: npm run aliases:check

      - name: Check curated corpus closure
        run: npm run corpus:closure

      - name: Check evaluation contracts
        run: npm run eval:check

      - name: Run tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

      - name: Build no-index runtime image
        run: npm run container:build:runtime-base

      - name: Verify fail-closed runtime image
        run: npm run container:smoke:runtime-base

      - name: Reject high and critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: k8s-yaml-assistant:test-runtime-base
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          hide-progress: true
          version: v0.70.0

  release_index:
    name: Release index artifact
    needs: release_state
    if: github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve required index identity
        id: index
        run: |
          npm run release:manifest -- index-identity \
            --github-output "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Require signed immutable index artifact
        env:
          INDEX_IMAGE: ${{ steps.index.outputs.index_image }}
          INDEX_TAG: ${{ steps.index.outputs.index_tag }}
        run: |
          INDEX_DIGEST="$(
            docker buildx imagetools inspect "$INDEX_IMAGE:$INDEX_TAG" \
              --format '{{json .Manifest.Digest}}' | tr -d '"'
          )"
          if [[ ! "$INDEX_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "release index artifact is missing" >&2
            exit 1
          fi
          cosign verify \
            --certificate-identity "https://github.com/kkxiaoa/k8s-yaml-assistant/.github/workflows/index-build.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$INDEX_IMAGE@$INDEX_DIGEST"
